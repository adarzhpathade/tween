name: Build and Package

on:
  push:
    branches:
      - main
      - master
      - 'task/**'
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Node dependencies
        working-directory: app
        run: npm ci

      - name: Run Cargo tests
        env:
          TWEEN_REQUIRE_E2E: "1"
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Run real setup download tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml -- --ignored test_real_setup_downloads

      - name: Build Tauri app
        working-directory: app
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npm run tauri build -- --target universal-apple-darwin || npm run tauri build
          else
            npm run tauri build
          fi
        shell: bash

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tween-${{ matrix.os }}
          path: |
            app/src-tauri/target/**/bundle/nsis/*.exe
            app/src-tauri/target/**/bundle/dmg/*.dmg
            app/src-tauri/target/**/bundle/deb/*.deb
            app/src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: warn

  build-rife-stream:
    name: Build RIFE Stream (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner_os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-x64
            runner_os: windows-latest
            ncnn_url: https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-windows-vs2022.zip
            ncnn_dir: ncnn-20240410-windows-vs2022
            binary: build/Release/rife-ncnn-vulkan-stream.exe
          - os_name: linux-x64
            runner_os: ubuntu-22.04
            ncnn_url: https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-ubuntu-2204.zip
            ncnn_dir: ncnn-20240410-ubuntu-2204
            binary: build/rife-ncnn-vulkan-stream
          - os_name: macos-arm64
            runner_os: macos-latest
            arch: arm64
            ncnn_url: https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-macos-vulkan.zip
            binary: build/rife-ncnn-vulkan-stream
          - os_name: macos-x64
            runner_os: macos-13
            arch: x86_64
            ncnn_url: https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-macos-vulkan.zip
            binary: build/rife-ncnn-vulkan-stream

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-dev glslang-tools libgomp1

      - name: Install MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: brew install molten-vk libomp

      - name: Download prebuilt ncnn release
        shell: bash
        run: |
          curl -L -o ncnn.zip ${{ matrix.ncnn_url }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p ncnn-frameworks
            unzip -q ncnn.zip -d ncnn-frameworks
            ls -la ncnn-frameworks
          else
            unzip -q ncnn.zip
            ls -la ${{ matrix.ncnn_dir }}
          fi

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S engine/rife-stream/src -A x64 -DUSE_SYSTEM_NCNN=ON -Dncnn_DIR="${{ github.workspace }}/${{ matrix.ncnn_dir }}/x64/lib/cmake/ncnn" -Dglslang_DIR="${{ github.workspace }}/${{ matrix.ncnn_dir }}/x64/lib/cmake/glslang"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -S engine/rife-stream/src -DCMAKE_BUILD_TYPE=Release -DUSE_SYSTEM_NCNN=ON -Dncnn_DIR="${{ github.workspace }}/${{ matrix.ncnn_dir }}/lib/cmake/ncnn" -Dglslang_DIR="${{ github.workspace }}/${{ matrix.ncnn_dir }}/lib/cmake/glslang"

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            VK_INC="/opt/homebrew/include"
            VK_LIB="/opt/homebrew/lib/libMoltenVK.dylib"
          else
            VK_INC="/usr/local/include"
            VK_LIB="/usr/local/lib/libMoltenVK.dylib"
          fi
          cmake -B build -S engine/rife-stream/src -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" -DUSE_SYSTEM_NCNN=ON -DNCNN_FRAMEWORK_DIR="${{ github.workspace }}/ncnn-frameworks" -DVulkan_INCLUDE_DIR="$VK_INC" -DVulkan_LIBRARY="$VK_LIB"

      - name: Build RIFE stream binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build --config Release -j 2 --target rife-ncnn-vulkan-stream
          else
            cmake --build build -j 2 --target rife-ncnn-vulkan-stream
            strip ${{ matrix.binary }} || true
          fi

      - name: Upload rife-stream artifact
        uses: actions/upload-artifact@v4
        with:
          name: rife-stream-${{ matrix.os_name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
