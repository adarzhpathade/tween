name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    name: Check version matches tag
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version matches tag
        shell: bash
        run: |
          node -e '
            const fs = require("fs");

            const ref = process.env.GITHUB_REF || "";
            const refName = process.env.GITHUB_REF_NAME || "";

            let expectedVersion = null;
            if (refName.startsWith("v")) {
              expectedVersion = refName.slice(1);
            } else if (ref.startsWith("refs/tags/v")) {
              expectedVersion = ref.replace("refs/tags/v", "");
            }

            const tauriConf = JSON.parse(fs.readFileSync("app/src-tauri/tauri.conf.json", "utf8"));
            const tauriVer = tauriConf.version;

            const cargoToml = fs.readFileSync("app/src-tauri/Cargo.toml", "utf8");
            const cargoMatch = cargoToml.match(/^version\s*=\s*"([^"]+)"/m);
            if (!cargoMatch) {
              console.error("Could not find version in app/src-tauri/Cargo.toml");
              process.exit(1);
            }
            const cargoVer = cargoMatch[1];

            const appPkg = JSON.parse(fs.readFileSync("app/package.json", "utf8"));
            const appPkgVer = appPkg.version;

            const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const rootPkgVer = rootPkg.version;

            console.log("--- Version Check Summary ---");
            console.log(`Git ref:          ${ref || "(unset)"}`);
            console.log(`Git ref_name:     ${refName || "(unset)"}`);
            console.log(`Expected version: ${expectedVersion || "(none - validating internal consistency)"}`);
            console.log(`tauri.conf.json:  ${tauriVer}`);
            console.log(`Cargo.toml:       ${cargoVer}`);
            console.log(`app/package.json: ${appPkgVer}`);
            console.log(`package.json:     ${rootPkgVer}`);

            const errors = [];

            if (expectedVersion) {
              if (tauriVer !== expectedVersion) {
                errors.push(`tauri.conf.json (${tauriVer}) != tag version (${expectedVersion})`);
              }
              if (cargoVer !== expectedVersion) {
                errors.push(`Cargo.toml (${cargoVer}) != tag version (${expectedVersion})`);
              }
              if (appPkgVer !== expectedVersion) {
                errors.push(`app/package.json (${appPkgVer}) != tag version (${expectedVersion})`);
              }
              if (rootPkgVer !== expectedVersion) {
                errors.push(`package.json (${rootPkgVer}) != tag version (${expectedVersion})`);
              }
            } else {
              if (tauriVer !== cargoVer || tauriVer !== appPkgVer || tauriVer !== rootPkgVer) {
                errors.push(`Version mismatch: tauri=${tauriVer}, cargo=${cargoVer}, appPkg=${appPkgVer}, rootPkg=${rootPkgVer}`);
              }
            }

            if (errors.length > 0) {
              console.error("\n::error::Version check failed!");
              for (const err of errors) {
                console.error(`::error::  - ${err}`);
              }
              process.exit(1);
            }

            console.log("\n[OK] Version check passed.");
          '

  build:
    name: Build (${{ matrix.target_name }})
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: windows-x64
            os: windows-latest
            bundle_args: --bundles nsis
            artifact_name: tween-windows-x64
            artifact_paths: app/src-tauri/target/**/bundle/nsis/*.exe
          - target_name: macos-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
            bundle_args: --target aarch64-apple-darwin --bundles dmg
            artifact_name: tween-macos-arm64
            artifact_paths: app/src-tauri/target/**/bundle/dmg/*.dmg
          - target_name: linux-x64
            os: ubuntu-22.04
            bundle_args: --bundles appimage,deb
            artifact_name: tween-linux-x64
            artifact_paths: |
              app/src-tauri/target/**/bundle/appimage/*.AppImage
              app/src-tauri/target/**/bundle/deb/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools \
            patchelf \
            desktop-file-utils \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri app
        working-directory: app
        run: npx tauri build ${{ matrix.bundle_args }}
        shell: bash

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  build-rife-stream:
    needs: [check-version]
    name: Build RIFE Stream (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner_os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows-x64
            runner_os: windows-latest
            ncnn_url: https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-windows-vs2022.zip
            ncnn_dir: ncnn-20240410-windows-vs2022
            binary: build/Release/rife-ncnn-vulkan-stream.exe
          - os_name: linux-x64
            runner_os: ubuntu-22.04
            ncnn_url: https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-ubuntu-2204.zip
            ncnn_dir: ncnn-20240410-ubuntu-2204
            binary: build/rife-ncnn-vulkan-stream
          - os_name: macos-arm64
            runner_os: macos-latest
            arch: arm64
            ncnn_url: https://github.com/Tencent/ncnn/releases/download/20240410/ncnn-20240410-macos-vulkan.zip
            binary: build/rife-ncnn-vulkan-stream

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslang-dev glslang-tools libgomp1

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK not found under C:\VulkanSDK" }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem "$($sdk.FullName)\Lib\vulkan-1.lib", "$($sdk.FullName)\Include\vulkan\vulkan.h"

      - name: Install MoltenVK (macOS)
        if: runner.os == 'macOS'
        run: brew install molten-vk libomp

      - name: Download prebuilt ncnn release
        shell: bash
        run: |
          curl -L -o ncnn.zip ${{ matrix.ncnn_url }}
          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p ncnn-frameworks
            unzip -q ncnn.zip -d ncnn-frameworks
            ls -la ncnn-frameworks
            ls ncnn-frameworks/ncnn.framework/Headers | head -20
            lipo -info ncnn-frameworks/ncnn.framework/ncnn || true
            lipo -info ncnn-frameworks/glslang.framework/glslang || true
            lipo -info ncnn-frameworks/openmp.framework/openmp || true
          else
            unzip -q ncnn.zip
            ls -la ${{ matrix.ncnn_dir }}
          fi

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "${{ github.workspace }}/${{ matrix.ncnn_dir }}/x64/lib/cmake" -Directory | Select-Object -ExpandProperty Name
          cmake -B build -S engine/rife-stream/src -A x64 -DVulkan_INCLUDE_DIR="$env:VULKAN_SDK/Include" -DVulkan_LIBRARY="$env:VULKAN_SDK/Lib/vulkan-1.lib" -DUSE_SYSTEM_NCNN=ON -Dncnn_DIR="${{ github.workspace }}/${{ matrix.ncnn_dir }}/x64/lib/cmake/ncnn" -Dglslang_DIR="${{ github.workspace }}/${{ matrix.ncnn_dir }}/x64/lib/cmake/glslang"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -S engine/rife-stream/src -DCMAKE_BUILD_TYPE=Release -DUSE_SYSTEM_NCNN=ON -Dncnn_DIR="${{ github.workspace }}/${{ matrix.ncnn_dir }}/lib/cmake/ncnn" -Dglslang_DIR="${{ github.workspace }}/${{ matrix.ncnn_dir }}/lib/cmake/glslang"

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # both macOS jobs run on the arm64 runner; x86_64 is cross-compiled
          VK_INC="/opt/homebrew/include"
          VK_LIB="/opt/homebrew/lib/libMoltenVK.dylib"
          lipo -info "$VK_LIB" || true
          cmake -B build -S engine/rife-stream/src -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" -DUSE_SYSTEM_NCNN=ON -DNCNN_FRAMEWORK_DIR="${{ github.workspace }}/ncnn-frameworks" -DVulkan_INCLUDE_DIR="$VK_INC" -DVulkan_LIBRARY="$VK_LIB"

      - name: Build RIFE stream binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build --config Release -j 2 --target rife-ncnn-vulkan-stream
          else
            cmake --build build -j 2 --target rife-ncnn-vulkan-stream
            strip ${{ matrix.binary }} || true
          fi

      - name: Upload rife-stream artifact
        uses: actions/upload-artifact@v4
        with:
          name: rife-stream-${{ matrix.os_name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Create GitHub Release (Draft)
    needs: [check-version, build, build-rife-stream]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          pattern: tween-*
          path: release-assets
          merge-multiple: true

      - name: Download stream engine binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rife-stream-*
          path: stream-binaries

      - name: Name stream engine assets and write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cp stream-binaries/rife-stream-windows-x64/rife-ncnn-vulkan-stream.exe release-assets/rife-ncnn-vulkan-stream-windows-x64.exe
          cp stream-binaries/rife-stream-linux-x64/rife-ncnn-vulkan-stream release-assets/rife-ncnn-vulkan-stream-linux-x64
          cp stream-binaries/rife-stream-macos-arm64/rife-ncnn-vulkan-stream release-assets/rife-ncnn-vulkan-stream-macos-arm64
          cd release-assets
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS

      - name: Inspect release assets
        run: |
          echo "=== Release Assets ==="
          ls -la release-assets
          cat release-assets/SHA256SUMS

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          name: Tween ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/rife-ncnn-vulkan-stream-linux-x64
            release-assets/rife-ncnn-vulkan-stream-macos-arm64
            release-assets/SHA256SUMS
