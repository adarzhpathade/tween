[package]
name = "tween"
version = "0.1.0"
description = "Tween"
authors = ["you"]
edition = "2021"

[lib]
name = "tween_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
flate2 = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process", "net", "sync"] }
futures-util = "0.3"
regex = "1.10"
tauri-plugin-dialog = "2"
base64 = "0.22"
rfd = "0.17"
sysinfo = "0.40"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
