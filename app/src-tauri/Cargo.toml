[package]
name = "tween"
version = "0.1.0"
description = "Tween"
authors = ["Adarsh Pathade"]
edition = "2021"
default-run = "tween"

[lib]
name = "tween_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
flate2 = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process", "net", "sync"] }
futures-util = "0.3"
regex = "1.10"
tauri-plugin-dialog = "2"
base64 = "0.22"
# default features would add xdg-portal, which clashes with tauri-plugin-dialog's gtk3 on Linux
rfd = { version = "0.17", default-features = false }
sysinfo = "0.40"
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
